<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroupChat - Simple Group Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        /* Header */
        .header {
            background: linear-gradient(to right, #a855f7, #6366f1);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Messages Area */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9fafb;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            margin-bottom: 8px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-bubble {
            background: white;
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #a855f7;
            max-width: 70%;
        }

        .message-user {
            font-weight: 700;
            color: #1f2937;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .message-text {
            color: #374151;
            font-size: 15px;
            word-wrap: break-word;
        }

        .message-image {
            max-width: 100%;
            margin-top: 8px;
            border-radius: 8px;
            max-height: 300px;
        }

        .message-time {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 4px;
        }

        .system-message {
            justify-content: center;
            margin: 12px 0;
        }

        .system-message-bubble {
            background: rgba(107, 114, 128, 0.1);
            color: #6b7280;
            padding: 8px 16px;
            border-radius: 12px;
            border-left: none;
            font-size: 12px;
            text-align: center;
        }

        .typing-indicator {
            color: #9ca3af;
            font-size: 13px;
            font-style: italic;
            padding: 10px 20px;
        }

        /* Input Area */
        .input-area {
            border-top: 1px solid #e5e7eb;
            padding: 16px;
            background: white;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .image-upload-label {
            cursor: pointer;
            font-size: 24px;
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .image-upload-label:hover {
            transform: scale(1.1);
        }

        .image-upload-input {
            display: none;
        }

        .input-field {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            max-height: 100px;
        }

        .input-field:focus {
            outline: none;
            border-color: #a855f7;
        }

        .send-btn {
            background: #a855f7;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            background: #9333ea;
        }

        .send-btn:disabled {
            background: #d1d5db;
            cursor: not-allowed;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .container {
                height: 100vh;
                border-radius: 0;
            }

            .header h1 {
                font-size: 22px;
            }

            .message-bubble {
                max-width: 85%;
            }

            .input-area {
                padding: 12px;
                gap: 8px;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #a855f7;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #9333ea;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #9ca3af;
            text-align: center;
            flex-direction: column;
            gap: 10px;
        }

        .empty-state-icon {
            font-size: 48px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>💬 GroupChat</h1>
            <p>Real-time group messaging</p>
        </div>

        <!-- Messages -->
        <div class="messages-area" id="messagesArea">
            <div class="empty-state">
                <div class="empty-state-icon">👋</div>
                <div>Welcome to GroupChat!</div>
                <div style="font-size: 13px;">Type a message to get started</div>
            </div>
        </div>

        <div id="typingIndicator" class="typing-indicator" style="display: none;"></div>

        <!-- Input -->
        <div class="input-area">
            <label class="image-upload-label" title="Share an image">
                🖼️
                <input type="file" class="image-upload-input" accept="image/*" id="imageInput">
            </label>
            <input 
                type="text" 
                class="input-field" 
                id="messageInput" 
                placeholder="Type your message..." 
                autocomplete="off"
            >
            <button class="send-btn" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        let allMessages = [];
        let typingUsers = new Set();

        // Generate random user colors
        const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8'];
        let currentUserColor = colors[Math.floor(Math.random() * colors.length)];

        function formatTime(date) {
            return new Date(date).toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });
        }

        function renderMessages() {
            const area = document.getElementById('messagesArea');
            
            if (allMessages.length === 0) {
                area.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">👋</div>
                        <div>Welcome to GroupChat!</div>
                        <div style="font-size: 13px;">Type a message to get started</div>
                    </div>
                `;
                return;
            }

            area.innerHTML = allMessages.map(msg => {
                if (msg.type === 'system') {
                    return `
                        <div class="message system-message">
                            <div class="system-message-bubble">${escapeHtml(msg.text)}</div>
                        </div>
                    `;
                }

                return `
                    <div class="message">
                        <div class="message-bubble">
                            <div class="message-user" style="color: ${msg.color}">${escapeHtml(msg.user)}</div>
                            ${msg.image ? `<img src="${msg.image}" class="message-image">` : ''}
                            <div class="message-text">${escapeHtml(msg.text)}</div>
                            <div class="message-time">${msg.time}</div>
                        </div>
                    </div>
                `;
            }).join('');

            // Auto scroll to bottom
            area.scrollTop = area.scrollHeight;
        }

        function addMessage(text, isOwn = true, user = 'You') {
            if (!text.trim()) return;

            allMessages.push({
                type: 'message',
                text: text,
                user: user,
                color: isOwn ? currentUserColor : colors[(Math.random() * colors.length) | 0],
                time: formatTime(new Date()),
                image: null
            });

            renderMessages();
        }

        function addImageMessage(imageData, user = 'You') {
            allMessages.push({
                type: 'message',
                text: '📷 Shared an image',
                user: user,
                color: currentUserColor,
                time: formatTime(new Date()),
                image: imageData
            });

            renderMessages();
        }

        function addSystemMessage(text) {
            allMessages.push({
                type: 'system',
                text: text
            });

            renderMessages();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Send message
        document.getElementById('sendBtn').addEventListener('click', () => {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (text) {
                addMessage(text);
                input.value = '';
                input.focus();
            }
        });

        // Enter key to send
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.getElementById('sendBtn').click();
            }
        });

        // Image upload
        document.getElementById('imageInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    addImageMessage(event.target.result);
                };
                reader.readAsDataURL(file);
            }
        });

        // Demo: Add welcome message
        setTimeout(() => {
            addSystemMessage('👋 Welcome to GroupChat! Start messaging...');
        }, 500);

        // Demo: Add a sample message
        setTimeout(() => {
            addMessage('Hey everyone! 👋', false, 'Friend');
        }, 1500);

        // Optional: Simulate typing indicator
        document.getElementById('messageInput').addEventListener('input', () => {
            const indicator = document.getElementById('typingIndicator');
            indicator.style.display = 'block';
            indicator.textContent = 'You are typing...';
        });

        document.getElementById('messageInput').addEventListener('blur', () => {
            const indicator = document.getElementById('typingIndicator');
            indicator.style.display = 'none';
        });
    </script>
</body>
</html>
